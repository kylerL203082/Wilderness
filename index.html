const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const rand=(x,y,seed=0)=>{
 let n=Math.imul(x,374761393)+
       Math.imul(y,668265263)+
       Math.imul(seed,1442695041);
 n=Math.imul(n^(n>>>13),1274126177);
 return ((n^(n>>>16))>>>0)/4294967295;
};

const lakes=[
 {x:1110,y:860,rx:275,ry:190},
 {x:2360,y:1580,rx:340,ry:250},
 {x:710,y:1880,rx:235,ry:200},
 {x:2720,y:390,rx:290,ry:170},
 {x:4780,y:3770,rx:195,ry:132},
 {x:5610,y:1300,rx:155,ry:115}
];

function water(x,y){
 if(lakes.some(l=>
  ((x-l.x)/l.rx)**2+((y-l.y)/l.ry)**2<1
 ))return true;

 if(x>3220&&x<5480&&y>1650&&y<4300){
  return Math.abs(
   y-(2300+(x-3220)*.57+Math.sin(x*.004)*75)
  )<36;
 }
 return false;
}

function dry(x,y){
 return x>25&&y>25&&
        x<WIDTH-25&&y<HEIGHT-25&&
        !water(x,y)&&!water(x-13,y)&&
        !water(x+13,y)&&!water(x,y-13)&&!water(x,y+13);
}

const BIOMES={

 grasslands:["Grasslands","#94a967"],
 highlands:["Rocky Highlands","#80877a"],
 wetlands:["Wetlands","#527e65"],
 snow:["Snowy Mountains","#d9e6e3"],
 hardwood:["Hardwood Forest","#877d4b"],
 badlands:["Badlands","#b47d56"]
};

const sites=[
 ["grasslands",3850,1350,1900,1600],
 ["highlands",5200,2210,1600,1580],
 ["wetlands",3600,3540,1570,1320],
 ["snow",5720,370,1630,1450],
 ["hardwood",1700,3600,1880,1350],
 ["badlands",5650,4380,1740,1450]
];

function biome(x,y){
 if(x<3280&&y<2500)return"pine";
 let score=-1,b="pine";
 for(const [id,sx,sy,rx,ry] of sites){
  const v=Math.exp(-(
   (x-sx)**2/rx**2+(y-sy)**2/ry**2
  )*1.6);
  if(v>score){score=v;b=id}
 }
 return b;
}

function makeNodes(){
 nodes=[];
 nodeGrid=new Map();
 for(let gy=0;gy<Math.ceil(HEIGHT/84);gy++){
  for(let gx=0;gx<Math.ceil(WIDTH/84);gx++){
   let x=gx*84+10+rand(gx,gy,1)*60;
   let y=gy*84+10+rand(gx,gy,2)*60;
   if(!dry(x,y)||rand(gx,gy,19)>=.731)continue;
   let nearOld=x<3200&&y<2400;
   let b=biome(x,y);
   let arr=resourceBiomes[b];
   let t=nearOld?
    (r=>r<.35?"tree":r<.53?"rock":r<.67?"berry":r<.84?"branch":"pebble")(rand(gx,gy,3)):
    arr[Math.floor(rand(gx,gy,3)*arr.length)];
   if(distance({x,y},SPAWN)<70&&["tree","rock"].includes(t))continue;
   nodes.push({
    id:nearOld?`${gx}_${gy}`:`ext_${gx}_${gy}`,
    x,y,type:t,variant:rand(gx,gy,4)
   });
  }
 }
 for(let i=0;i<10;i++){
  let t=i*Math.PI/5;
  let r=115+(i%3)*35;
  let x=SPAWN.x+Math.cos(t)*r;
  let y=SPAWN.y+Math.sin(t)*r;
  if(dry(x,y))nodes.push({
   id:`starter_${i}`,x,y,
   type:i%2?"pebble":"branch",
   variant:.55
  });
 }
 for(let i=0;i<8;i++){
  let a=i*2.39996;
  let x=SPAWN.x+Math.cos(a)*(290+i*19);
  let y=SPAWN.y+Math.sin(a)*(290+i*19);
  if(dry(x,y))nodes.push({
   id:`farm_seed_patch_${i}`,
   x,y,type:"seeds",variant:.4
  });
 }
 for(const n of nodes){
  const k=`${Math.floor(n.x/160)}:${Math.floor(n.y/160)}`;
  if(!nodeGrid.has(k))nodeGrid.set(k,[]);
  nodeGrid.get(k).push(n);
 }
}

function nearNodes(x,y,r=100){
 let arr=[];
 for(let a=Math.floor((x-r)/160);a<=Math.floor((x+r)/160);a++){
  for(let b=Math.floor((y-r)/160);b<=Math.floor((y+r)/160);b++){
   arr.push(...(nodeGrid.get(a+":"+b)||[]));
  }
 }
 return arr;
}

function createAnimals(){
 let a=[];
 for(let gy=0;gy<23;gy++){
  for(let gx=0;gx<30;gx++){
   if(rand(gx,gy,93)>.61)continue;
   let x=90+gx*215+rand(gx,gy,94)*115;
   let y=90+gy*215+rand(gx,gy,95)*115;
   if(x>WIDTH-75||y>HEIGHT-75||
      distance({x,y},SPAWN)<340||!dry(x,y))continue;
   let b=biome(x,y);
   let types=b==="grasslands"?["chicken","sheep","cow","rabbit"]:
    b==="pine"?["rabbit","deer","wolf"]:
    b==="hardwood"?["deer","bear","rabbit"]:
    b==="snow"?["wolf","goat","bear"]:
    b==="highlands"?["goat","wolf"]:
    b==="wetlands"?["duck","frog"]:
    ["coyote","rabbit"];
   let type=types[Math.floor(rand(gx,gy,96)*types.length)];
   a.push({
    id:`wild_${gx}_${gy}`,
    type,x,y,
    homeX:x,homeY:y,
    hp:ANIMALS[type][2],
    mode:"wild",
    phase:rand(gx,gy,97)*6,
    age:1,feed:80,penId:null
   });
  }
 }
 return a;
}

 for(const k of [
  "player","stats","inventory","tools",

function has(cost){
 return Object.entries(cost).every(
  ([k,v])=>(S.inventory[k]||0)>=v
 );
}
function take(cost){
 if(!has(cost))return false;
 for(const [k,v] of Object.entries(cost))S.inventory[k]-=v;
 return true;
}
function gain(item,n){
 S.inventory[item]=(S.inventory[item]||0)+n;
}
function costText(cost){

function isNight(){

function wolfActive(a){

  rand(
   Math.floor((a.homeX||a.x)/215),
   Math.floor((a.homeY||a.y)/215),
   729
  )<.2;
}

function nearBuilding(type,range=135){
 return S.buildings.filter(b=>
  (!type||b.type===type)&&distance(b,S.player)<range
 ).sort((a,b)=>distance(a,S.player)-distance(b,S.player))[0];
}

function nearWater(){
 for(let a=0;a<6.28;a+=.2){
  if(water(
   S.player.x+Math.cos(a)*43,
   S.player.y+Math.sin(a)*43
  ))return true;
 }
 return false;
}

function nearFire(){
 return S.fires.some(f=>
  f.fuel>0&&distance(f,S.player)<125
 )||S.buildings.some(b=>
  b.type==="hearth"&&b.fuel>0&&distance(b,S.player)<145
 );
}
function nearShelter(){
 return nearBuilding("cabin")||nearBuilding("tent");
}
function nearWell(){
 return S.buildings.find(b=>
  b.type==="well"&&
  distance(b,S.player)<135&&
  b.charges>0
 );
}

function gathered(n){
 return !!S.gathered[n.id];
}

function canWalk(x,y){
 if(!dry(x,y))return false;
 for(const n of nearNodes(x,y,33)){
  if(!gathered(n)&&
     ["tree","hardwood","rock"].includes(n.type)&&
     distance(n,{x,y})<(n.type==="rock"?18:21)){
   return false;
  }
 }
 for(const b of S.buildings){
  if(["coop","sheepPen","cattlePasture","trough"]
    .includes(b.type))continue;
  if(b.type==="gate"&&b.open)continue;
  if(["fence","gate"].includes(b.type)){
   if(Math.abs(x-b.x)<23&&Math.abs(y-b.y)<23)return false;
  }else if(
   Math.abs(x-b.x)<BUILD[b.type][3]+9&&
   Math.abs(y-b.y)<BUILD[b.type][3]*.55+12
  )return false;
 }
 return true;
}

function explored(x,y){
 return S.exploredTiles.includes(
  Math.floor(y/80)*80+Math.floor(x/80)
 );
}

function reveal(x,y){
 let i=Math.floor(x/80),j=Math.floor(y/80);
 let a=new Set(S.exploredTiles);
 for(let dy=-3;dy<=3;dy++){
  for(let dx=-3;dx<=3;dx++){
   if(dx*dx+dy*dy<13&&
      i+dx>=0&&i+dx<80&&
      j+dy>=0&&j+dy<60){
    a.add((j+dy)*80+i+dx);
   }
  }
 }
 S.exploredTiles=[...a];
}

function nearbyGather(){
 const corpse=S.carcasses
  .filter(c=>distance(c,S.player)<80)
  .sort((a,b)=>distance(a,S.player)-distance(b,S.player))[0];

 if(corpse)return harvestCarcass(corpse);

 let n=nearNodes(S.player.x,S.player.y,80)
  .filter(n=>!gathered(n)&&distance(n,S.player)<65)
  .sort((a,b)=>distance(a,S.player)-distance(b,S.player))[0];

 if(n)gather(n);
 else notice("Move closer to a fallen resource.");
}

function gather(n){
 if(gathered(n)||S.paused||S.dead)return;

 if(distance(n,S.player)>66){
  return notice("Move closer.");
 }

 const t=n.type;

 if(["tree","hardwood"].includes(t)&&!S.tools.axe){
  return notice("Craft an axe to harvest trees.");
 }

 if(["rock","iron","coal","minerals"].includes(t)&&
    !S.tools.pickaxe){
  return notice("Craft a pickaxe to mine stone or ore.");
 }

 let k={
  tree:"logs",
  branch:"sticks",
  pebble:"pebbles",
  rock:"stone"
 }[t]||t;

 let base=["tree","hardwood"].includes(t)?
  3:["rock","berry"].includes(t)?2:1;

 let nQty=base+Math.floor(n.variant*3);

 if(t==="berry")k="berries";

 gain(k,nQty);

 if(t==="hardwood")gain("logs",2);

 if(S.tools.ironAxe&&["tree","hardwood"].includes(t)){
  gain("logs",2);
 }

 if(S.tools.ironPickaxe&&
    ["rock","iron","coal","minerals"].includes(t)){
  gain(k,1);
 }

 S.milestones.gathered[k]=
  (S.milestones.gathered[k]||0)+nQty;

 if(["grass","seeds","hay"].includes(k)){
  S.milestones.baitGathered=true;
 }

 S.gathered[n.id]=true;
 S.totalGathered++;

 notice("Collected "+nQty+" "+(ITEMS[k]?.[1]||k)+".");

 checkMissions();
 renderUI();
 save();
}

function tickWorld(minutes){
 S.time+=minutes;

 while(S.time>=1440){
  S.time-=1440;
  S.day++;
  notice("Day "+S.day+" begins!");
 }

 for(const b of S.buildings){

  if(b.type==="farmPlot"&&b.crop&&b.watered&&!b.ripe){
   b.growth=(Number(b.growth)||0)+minutes;

   if(b.growth>=CROP[b.crop][2]){
    b.ripe=true;
   }
  }

  if(b.type==="garden"&&b.planted&&!b.ripe){
   b.progress=(b.progress||0)+minutes;

   if(b.progress>=240){
    b.ripe=true;
   }
  }

  if(["collector","well"].includes(b.type)){
   let cap=b.type==="well"?
    (b.level>1?10:6):
    (b.level>1?6:3);

   let duration=b.type==="well"?
    (b.level>1?90:120):180;

   b.waterProgress=(b.waterProgress||0)+minutes;

   while(b.charges<cap&&b.waterProgress>=duration){
    b.charges++;
    b.waterProgress-=duration;
   }

   if(b.charges>=cap){
    b.waterProgress=Math.min(duration,b.waterProgress);
   }
  }

  if(b.type==="smokehouse"&&b.smokeRemaining>0){
   b.smokeRemaining=Math.max(0,b.smokeRemaining-minutes);

   if(!b.smokeRemaining){
    b.smokeReady=(b.smokeReady||0)+b.smokeAmount;
    b.smokeAmount=0;
   }
  }

  if(b.type==="hearth"){
   b.fuel=Math.max(0,(b.fuel||0)-minutes);
  }
 }

 for(const f of S.fires){
  f.fuel=Math.max(0,f.fuel-minutes);
 }
}

 if(S.dead)return;

 if(!nearFire()&&!b){

 if(S.stats.hunger<12||S.stats.thirst<12){

 }

 let minutes=b?.type==="cabin"?360:240;

 tickWorld(minutes);
 livestockTick(minutes);

 S.stats.energy=clamp(
  S.stats.energy+(b?.type==="cabin"?90:70),0,100
 );

 S.stats.health=clamp(S.stats.health+15,0,100);

  S.stats.hunger-minutes/240*14,0,100
 );

 S.stats.thirst=clamp(
  S.stats.thirst-minutes/240*17,0,100
 );

 notice(`Rested ${minutes/60} hours.`);

 checkMissions();
 renderUI();
 save();
}

 const effects={

function drink(){
 if(S.dead)return;

 const well=nearWell();
 const collector=nearBuilding("collector");

 if(
  !nearWater()&&!well&&
  !(collector&&collector.charges>0)&&
  !(S.jugWater>0)
 ){
  return notice(

  );
 }

 if(S.stats.thirst>=99){
  return notice("You're not thirsty.");
 }

 if(!nearWater()){
  if(well){
   well.charges--;
  }else if(collector&&collector.charges>0){
   collector.charges--;
   S.milestones.collectorDrinks++;

 S.stats.thirst=100;

function movePlayer(dt){
 let p=S.player;

 let dx=
  Number(keys.has("d")||
         keys.has("arrowright")||
         pressed.has("right"))-
  Number(keys.has("a")||
         keys.has("arrowleft")||
         pressed.has("left"));

 let dy=
  Number(keys.has("s")||
         keys.has("arrowdown")||
         pressed.has("down"))-
  Number(keys.has("w")||
         keys.has("arrowup")||
         pressed.has("up"));

 p.moving=!!(dx||dy);

 if(!p.moving){
  S.stats.energy=clamp(S.stats.energy+dt*.1,0,100);
  return;
 }

 const len=Math.hypot(dx,dy);

 dx/=len;
 dy/=len;

 p.dir=Math.abs(dx)>Math.abs(dy)?
  dx>0?"right":"left":
  dy>0?"down":"up";

 let speed=
  (keys.has("shift")?75:145)*
  (S.stats.energy<10?.55:1);

 let x=p.x,y=p.y;

 if(canWalk(p.x+dx*speed*dt,p.y)){
  p.x+=dx*speed*dt;
 }

 if(canWalk(p.x,p.y+dy*speed*dt)){
  p.y+=dy*speed*dt;
 }

 if(x!==p.x||y!==p.y){
  p.step+=dt*8;

  S.distanceWalked+=
   Math.hypot(p.x-x,p.y-y)/10;

  S.stats.energy-=dt*.07;
  S.stats.thirst-=dt*.04;
 }
}

function updateAnimals(dt){
 for(const a of S.animals){

  if(!wolfActive(a)||
     a.penId&&a.mode==="pen"){
   continue;
  }

  const d=distance(a,S.player);

  if(d>900&&a.mode!=="follow")continue;

  a.phase=(a.phase||0)+dt*2;

  const info=ANIMALS[a.type];
  const isPredator=info[3]>0;
  const speed=isPredator?
   95:info[0]==="🐇"?112:68;

  if(a.mode==="follow"){

   if(d>450){
    a.mode="wild";
    continue;
   }

   moveAnimal(a,S.player.x,S.player.y,speed*dt);

   let pen=S.buildings.find(b=>
    PENS[b.type]&&
    PENS[b.type][0]===a.type&&
    b.gateOpen&&
    distance(b,a)<BUILD[b.type][3]+25&&
    S.animals.filter(v=>v.penId===b.id).length<
     PENS[b.type][1]+(b.level>1?2:0)
   );

   if(pen){
    a.penId=pen.id;
    a.mode="inside";
    a.x=pen.x;
    a.y=pen.y;

    notice(
     info[0]+" entered the pen. Close the gate!"
    );
   }

  }else if(
   isPredator&&
   d<145*(isNight()?1.18:1)&&
   !nearFire()&&!nearShelter()&&
   distance(S.player,SPAWN)>180
  ){

   if(d>39){
    moveAnimal(
     a,S.player.x,S.player.y,speed*dt
    );
   }else if(!a.attackCooldown){
    let damage=info[3]*
     (S.tools.hideArmor?.55:1);

    S.stats.health-=damage;
    a.attackCooldown=3;
    S.combat.predatorEncounters++;

    notice(
     "A "+a.type+
     " attacked! Run toward shelter."
    );
   }

  }else if(
   d<95&&!isPredator&&
   ["deer","rabbit","goat","duck"]
    .includes(a.type)
  ){
   moveAnimal(
    a,
    a.x+(a.x-S.player.x),
    a.y+(a.y-S.player.y),
    speed*dt
   );

  }else if(
   rand(
    Math.floor(a.x/30),
    Math.floor(a.y/30),
    Math.floor(a.phase)
   )>.82
  ){
   let tx=a.homeX+Math.cos(a.phase)*125;
   let ty=a.homeY+Math.sin(a.phase)*125;

   moveAnimal(a,tx,ty,speed*dt*.2);
  }

  a.attackCooldown=Math.max(
   0,(a.attackCooldown||0)-dt
  );
 }
}

function moveAnimal(a,x,y,step){
 let d=Math.hypot(x-a.x,y-a.y);

 if(d<2)return;

 let nx=a.x+(x-a.x)/d*Math.min(d,step);
 let ny=a.y+(y-a.y)/d*Math.min(d,step);

 if(dry(nx,ny)){
  a.x=nx;
  a.y=ny;
 }
}

function livestockTick(minutes){
 for(const barn of S.buildings.filter(b=>b.type==="barn")){

  barn.feedClock=(barn.feedClock||0)+minutes;

  if(barn.feedClock>=120){
   barn.feedClock%=120;

   for(const p of S.buildings.filter(b=>
    PENS[b.type]&&
    distance(b,barn)<390&&
    b.feed<280
   )){
    const food=[
     "hay","grass","wheat","seeds"
    ].find(k=>(barn.storage[k]||0)>0);

    if(!food)break;

    barn.storage[food]--;
    p.feed+=140;
   }
  }
 }

 for(const p of S.buildings.filter(b=>PENS[b.type])){
  const animals=S.animals.filter(a=>
   a.penId===p.id&&a.mode==="pen"
  );

  const cfg=PENS[p.type];

  if(!animals.length)continue;

  if(p.feed>0){

   p.feed=Math.max(0,p.feed-minutes*.03);

   p.livestockTimer=
    (p.livestockTimer||0)+minutes;

   if(p.livestockTimer>=cfg[4]*(p.level>1?.7:1)){
    p.livestockTimer=0;

    p.products[cfg[3]]=
     (p.products[cfg[3]]||0)+
     cfg[5]*Math.min(animals.length,2)+
     (p.level>1?1:0);

    if(cfg[3]==="eggs"){
     p.products.feathers=
      (p.products.feathers||0)+1;
    }
   }

   if(animals.length>=2){
    p.breedTimer=(p.breedTimer||0)+minutes;

    if(
     p.breedTimer>=(p.level>1?340:480)&&
     animals.length<
      cfg[1]+(p.level>1?2:0)
    ){
     p.breedTimer=0;

     S.animals.push({
      id:"baby"+Date.now()+S.animals.length,
      type:cfg[0],
      x:p.x+8,
      y:p.y+8,
      homeX:p.x,
      homeY:p.y,
      hp:60,
      age:.2,
      mode:"pen",
      penId:p.id,
      phase:0
     });

     notice(
      "A baby "+cfg[0]+" was born!"
     );
    }
   }
  }
 }
}

function hitAnimal(a,damage){
 if(a.penId){
  return notice(
   "Domestic livestock cannot be hunted."
  );
 }

 if(!loot[a.type]){
  return notice(
   "This animal isn't huntable."
  );
 }

 a.hp=(a.hp??ANIMALS[a.type][2])-damage;

 if(a.hp>0){
  return notice(
   a.type+": "+a.hp+" health remaining."
  );
 }

 S.animals=S.animals.filter(v=>v!==a);

 const [meat,hides]=loot[a.type];

 S.carcasses.push({
  id:"corpse"+Date.now(),
  x:a.x,
  y:a.y,
  type:a.type,
  meat,
  hides,
  decay:720
 });

 S.combat.kills[a.type]=
  (S.combat.kills[a.type]||0)+1;

 notice(
  a.type+
  " hunted! Click or press E near the remains."
 );

 checkMissions();
}

function attack(targetAnimal=null,point=null){
 if(S.dead||S.paused)return;

 const weapon=S.combat.equipped;

 if(weapon==="hands"){
  return notice(
   "Craft and equip a spear or bow (2 or 3)."
  );
 }

 const t=targetAnimal||
  S.animals.filter(a=>
   loot[a.type]&&!a.penId&&wolfActive(a)
  ).sort((a,b)=>
   distance(a,S.player)-distance(b,S.player)
  )[0];

 if(!t){
  return notice(
   "No huntable animal nearby."
  );
 }

 let d=distance(t,S.player);

 if(weapon==="spear"){
  if(d>96){
   return notice(
    "Get within spear range."
   );
  }

  hitAnimal(
   t,S.tools.ironSpear?53:33
  );

 }else{

  if(!S.inventory.arrows){
   return notice(
    "Craft arrows at a workbench."
   );
  }

  if(d>500){
   return notice(
    "Target out of bow range."
   );
  }

  S.inventory.arrows--;
  S.combat.shots++;

  hitAnimal(t,42);
 }

 S.stats.energy=Math.max(
  0,S.stats.energy-2
 );

 checkMissions();
 renderUI();
 save();
}

function harvestCarcass(c){
 if(distance(c,S.player)>80){
  return notice(
   "Move closer to the remains."
  );
 }

 gain("rawMeat",c.meat);
 gain("hides",c.hides);

 S.carcasses=S.carcasses.filter(v=>v!==c);

 S.combat.loot++;

 notice(
  "Harvested "+c.meat+
  " meat and "+c.hides+" hides."
 );

 checkMissions();
 renderUI();
 save();
}

function advance(dt){
 if(S.dead||S.paused)return;

 movePlayer(dt);
 tickWorld(dt*2);

 const b=biome(
  S.player.x,S.player.y
 );

 const stats=S.stats;

 stats.hunger-=dt*.055;

 stats.thirst-=dt*
  (b==="badlands"?.18:.09);

 let target=
  nearFire()?100:
  nearShelter()?85:
  b==="snow"?(isNight()?8:29):
  isNight()?22:82;

 if(S.tools.woolWrap){
  target=Math.min(100,target+22);
 }

 stats.warmth+=
  (target-stats.warmth)*
  Math.min(1,dt*.065);

 if(stats.hunger<=0||stats.thirst<=0){
  stats.health-=dt*.9;
 }

 if(stats.warmth<16){
  stats.health-=dt*.45;
 }

 if(stats.energy<1){
  stats.health-=dt*.22;
 }

 if(stats.health<=0){
  die();
  return;
 }

 for(const k of Object.keys(stats)){
  stats[k]=clamp(stats[k],0,100);
 }

 updateAnimals(dt);
 livestockTick(dt*2);

 const bname=biome(
  S.player.x,S.player.y
 );

 if(!S.discovered[bname]){
  S.discovered[bname]=true;

  notice(
   "Discovered "+BIOMES[bname][0]
  );
 }

 reveal(S.player.x,S.player.y);
 checkMissions();

 uiTimer+=dt;
 saveTimer+=dt;

 if(uiTimer>.36){
  renderUI();
  uiTimer=0;
 }

 if(saveTimer>15){
  save();
  saveTimer=0;
 }
}

function die(){
 S.dead=true;
 S.stats.health=0;

 notice(
  "You did not survive. Start a new game to begin again."
 );

 S.paused=true;
}

// WORLD RENDERING
// The world is generated using canvas drawing.
// No external images or internet connection required.

function paint(){
 const p=S.player;

 cam.x=clamp(
  p.x-VIEW.w/2,0,WIDTH-VIEW.w
 );

 cam.y=clamp(
  p.y-VIEW.h/2,0,HEIGHT-VIEW.h
 );

 ctx.clearRect(0,0,960,600);
 ctx.save();

 ctx.scale(
  960/VIEW.w,
  600/VIEW.h
 );

 ctx.fillStyle=BIOMES[
  biome(p.x,p.y)
 ][1];

 ctx.fillRect(
  0,0,VIEW.w,VIEW.h
 );

 for(
  let gy=Math.floor(cam.y/40);
  gy<Math.ceil((cam.y+VIEW.h)/40);
  gy++
 ){
  for(
   let gx=Math.floor(cam.x/40);
   gx<Math.ceil((cam.x+VIEW.w)/40);
   gx++
  ){
   let x=gx*40-cam.x;
   let y=gy*40-cam.y;
   let bi=biome(gx*40,gy*40);
   let n=rand(gx,gy,7);

   ctx.fillStyle=BIOMES[bi][1];
   ctx.fillRect(x,y,41,41);

   if(n>.68&&bi!=="snow"){
    ctx.fillStyle="#496d3c";
    ctx.fillRect(x+7,y+17,3,7);
    ctx.fillRect(x+26,y+9,2,5);
   }
  }
 }

 // LAKES

 for(const l of lakes){
  if(
   Math.abs(l.x-cam.x)>VIEW.w+l.rx||
   Math.abs(l.y-cam.y)>VIEW.h+l.ry
  )continue;

  ctx.fillStyle="#c4b68b";
  ctx.beginPath();

  ctx.ellipse(
   l.x-cam.x,
   l.y-cam.y,
   l.rx*1.06,
   l.ry*1.06,
   0,0,7
  );

  ctx.fill();

  ctx.fillStyle="#347f94";
  ctx.beginPath();

  ctx.ellipse(
   l.x-cam.x,
   l.y-cam.y,
   l.rx,l.ry,
   0,0,7
  );

  ctx.fill();
 }

 // RIVER

 ctx.strokeStyle="#35849a";
 ctx.lineWidth=70;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.beginPath();

 for(let x=3220;x<=5480;x+=35){
  let y=
   2300+
   (x-3220)*.57+
   Math.sin(x*.004)*75;

  if(x===3220){
   ctx.moveTo(
    x-cam.x,
    y-cam.y
   );
  }else{
   ctx.lineTo(
    x-cam.x,
    y-cam.y
   );
  }
 }

 ctx.stroke();

 // DRAW ALL WORLD OBJECTS IN DEPTH ORDER

 let draw=[];

 for(const n of nearNodes(p.x,p.y,650)){
  if(
   !gathered(n)&&
   Math.abs(n.x-cam.x)<VIEW.w+90&&
   Math.abs(n.y-cam.y)<VIEW.h+90
  ){
   draw.push({
    type:"node",
    obj:n,
    y:n.y
   });
  }
 }

 for(const b of S.buildings){
  draw.push({
   type:"building",
   obj:b,
   y:b.y
  });
 }

 for(const f of S.fires){
  draw.push({
   type:"fire",
   obj:f,
   y:f.y
  });
 }

 for(const a of S.animals){
  if(
   wolfActive(a)&&
   Math.abs(a.x-cam.x)<VIEW.w+50&&
   Math.abs(a.y-cam.y)<VIEW.h+50
  ){
   draw.push({
    type:"animal",
    obj:a,
    y:a.y
   });
  }
 }

 for(const c of S.carcasses){
  draw.push({
   type:"corpse",
   obj:c,
   y:c.y
  });
 }

 draw.push({
  type:"player",
  obj:p,
  y:p.y
 });

 draw.sort((a,b)=>a.y-b.y);

 for(const d of draw){
  const o=d.obj;

  const x=o.x-cam.x;
  const y=o.y-cam.y;

  if(
   x<-100||x>VIEW.w+100||
   y<-120||y>VIEW.h+100
  )continue;

  if(d.type==="node"){
   drawNode(o,x,y);
  }

  if(d.type==="building"){
   drawBuilding(o,x,y);
  }

  if(d.type==="animal"){
   drawAnimal(o,x,y);
  }

  if(d.type==="corpse"){
   ctx.fillStyle="#603d2d";
   ctx.beginPath();

   ctx.ellipse(
    x,y,17,9,0,0,7
   );

   ctx.fill();

   ctx.font="19px Arial";
   ctx.fillText("🥩",x-12,y-8);
  }

  if(d.type==="player"){
   drawPlayer(x,y);
  }

  if(d.type==="fire"){
   drawFire(o,x,y);
  }
 }

 // BUILDING PLACEMENT PREVIEW

 if(mode==="build"&&mouse.inside){
  let x=
   buildType==="fence"||
   buildType==="gate"?
   Math.round(mouse.x/32)*32:
   Math.round(mouse.x/16)*16;

  let y=
   buildType==="fence"||
   buildType==="gate"?
   Math.round(mouse.y/32)*32:
   Math.round(mouse.y/16)*16;

  let r=BUILD[buildType][3];

  ctx.strokeStyle=
   validSpot(buildType,x,y)?
   "#bdf3a4":"#f4836e";

  ctx.lineWidth=3;
  ctx.setLineDash([7,5]);

  ctx.strokeRect(
   x-cam.x-r,
   y-cam.y-r,
   r*2,r*2
  );

  ctx.setLineDash([]);
 }

 // DELETE MODE PREVIEW

 if(mode==="delete"&&mouse.inside){
  let t=objectAt(
   mouse.x,mouse.y
  );

  if(t){
   ctx.strokeStyle="#ff695c";
   ctx.lineWidth=4;

   ctx.strokeRect(
    t.obj.x-cam.x-26,
    t.obj.y-cam.y-46,
    52,60
   );
  }
 }

 // NIGHT FILTER

 if(isNight()){
  ctx.fillStyle="rgba(5,15,26,.42)";
  ctx.fillRect(
   0,0,VIEW.w,VIEW.h
  );
 }

 ctx.restore();

 if(S.paused&&!modalOpen()){
  ctx.fillStyle="#09181188";
  ctx.fillRect(0,0,960,600);

  ctx.fillStyle="#f4d38a";
  ctx.font="bold 36px Arial";
  ctx.textAlign="center";

  ctx.fillText(
   S.dead?
   "YOU DID NOT SURVIVE":
   "PAUSED",
   480,300
  );

  ctx.textAlign="left";
 }
}

function drawNode(o,x,y){
 ctx.save();
 ctx.translate(x,y);

 let t=o.type;

 if(t==="tree"||t==="hardwood"){
  ctx.fillStyle="#654b30";
  ctx.fillRect(-5,-23,10,32);

  for(let [a,r,col] of [
   [-5,29,"#143d2c"],
   [-25,24,"#22603d"],
   [-43,18,"#337750"]
  ]){
   ctx.fillStyle=col;
   ctx.beginPath();

   ctx.moveTo(0,a-36);
   ctx.lineTo(-r,a);
   ctx.lineTo(r,a);

   ctx.fill();
  }

 }else if(
  ["rock","iron","coal","minerals"]
   .includes(t)
 ){
  ctx.fillStyle="#84948c";
  ctx.beginPath();

  ctx.moveTo(-19,4);
  ctx.lineTo(-12,-16);
  ctx.lineTo(5,-22);
  ctx.lineTo(21,-3);
  ctx.lineTo(15,9);

  ctx.fill();

  if(t!=="rock"){
   ctx.font="14px Arial";
   ctx.fillText(
    ITEMS[t][0],-8,-12
   );
  }

 }else if(t==="berry"){
  ctx.fillStyle="#276846";
  ctx.beginPath();

  ctx.arc(0,-8,19,0,7);
  ctx.fill();

  ctx.font="16px Arial";
  ctx.fillText("🍓",-11,-12);

 }else if(t==="branch"){
  ctx.strokeStyle="#bb9561";
  ctx.lineWidth=6;
  ctx.beginPath();

  ctx.moveTo(-16,5);
  ctx.lineTo(16,-5);
  ctx.stroke();

 }else if(t==="pebble"){
  ctx.fillStyle="#b9c3b6";
  ctx.beginPath();

  ctx.ellipse(
   0,0,12,9,0,0,7
  );

  ctx.fill();

 }else{
  ctx.fillStyle="#438050";
  ctx.fillRect(-2,-18,4,22);

  ctx.font="17px Arial";

  ctx.fillText(
   ITEMS[t]?.[0]||"🌿",
   -10,-15
  );
 }

 ctx.restore();
}

function drawBuilding(b,x,y){
 const cfg=BUILD[b.type];
 const r=cfg[3];
 const icon=cfg[0];

 const big=[
  "cabin","barn","smokehouse",
  "woodshed","rootCellar"
 ].includes(b.type);

 ctx.save();
 ctx.translate(x,y);

 ctx.fillStyle="#0b241a77";
 ctx.beginPath();

 ctx.ellipse(
  0,8,r+7,12,0,0,7
 );

 ctx.fill();

 if(["fence","gate"].includes(b.type)){
  if(b.type==="gate"&&b.open){
   ctx.strokeStyle="#b68a52";
   ctx.lineWidth=6;
   ctx.beginPath();

   ctx.moveTo(-12,12);
   ctx.lineTo(-12,-13);
   ctx.stroke();

  }else{
   ctx.strokeStyle="#b38a52";
   ctx.lineWidth=6;
   ctx.beginPath();

   ctx.moveTo(-16,-9);
   ctx.lineTo(16,-9);
   ctx.moveTo(-16,5);
   ctx.lineTo(16,5);

   ctx.stroke();
  }

  ctx.fillStyle="#5a412c";
  ctx.fillRect(-5,-17,9,30);

 }else if(PENS[b.type]){
  ctx.fillStyle="#77a27a55";

  ctx.fillRect(
   -r*.7,-r*.48,
   r*1.4,r*.95
  );

  ctx.lineWidth=4;
  ctx.strokeStyle="#9e8054";

  ctx.strokeRect(
   -r*.7,-r*.48,
   r*1.4,r*.95
  );

  ctx.fillStyle=
   b.gateOpen?"#65d190":"#e3c68a";

  ctx.fillRect(
   -18,r*.48-4,36,7
  );

  ctx.font="20px Arial";
  ctx.fillText(
   icon,-12,-r*.55
  );

 }else if(
  b.type==="farmPlot"||
  b.type==="garden"
 ){
  ctx.fillStyle="#64482e";

  ctx.fillRect(
   -31,-27,62,50
  );

  ctx.strokeStyle="#bf965d";
  ctx.lineWidth=3;

  ctx.strokeRect(
   -31,-27,62,50
  );

  if(b.crop){
   ctx.fillStyle=
    b.ripe?"#c5b15d":"#57aa57";

   for(let i=-20;i<=20;i+=13){
    for(let j=-15;j<=15;j+=14){
     ctx.beginPath();

     ctx.ellipse(
      i,
      j-6,
      4+b.growth/CROP[b.crop][2]*4,
      6+b.growth/CROP[b.crop][2]*4,
      0,0,7
     );

     ctx.fill();
    }
   }

   ctx.font="17px Arial";
   ctx.fillText(
    CROP[b.crop][0],
    -9,-29
   );
  }

 }else{
  ctx.fillStyle=
   big?"#83543a":"#795c42";

  ctx.fillRect(
   -r*.75,-r*.65,
   r*1.5,r*.86
  );

  ctx.fillStyle=
   big?"#624d3b":"#9b7f55";

  ctx.beginPath();
  ctx.moveTo(-r*.88,-r*.65);
  ctx.lineTo(0,-r*1.24);
  ctx.lineTo(r*.88,-r*.65);
  ctx.fill();

  ctx.font=
   `${Math.min(37,r)}px Arial`;

  ctx.textAlign="center";
  ctx.fillText(
   icon,0,-r*.48
  );
  ctx.textAlign="left";

  if(
   b.type==="smokehouse"&&
   b.smokeRemaining>0
  ){
   ctx.fillStyle="#d5d1bc66";
   ctx.beginPath();

   ctx.arc(
    r*.55,-r*1.4,13,0,7
   );

   ctx.fill();
  }
 }

 if(b.level>1){
  ctx.strokeStyle="#f4d78b";
  ctx.lineWidth=2;

  ctx.strokeRect(
   -r*.75,-r*.7,
   r*1.5,r*.92
  );
 }

 ctx.restore();
}

function drawFire(f,x,y){

 for(let i=0;i<8;i++){

  ctx.arc(

  );

function point(e){
 let r=cv.getBoundingClientRect();

 let w=960/r.width;

function validSpot(type,x,y){
 const r=BUILD[type][3];

 if(
  distance({x,y},S.player)>205||
  distance({x,y},S.player)<r+16||
  x<r+15||
  x>WIDTH-r-15||
  y<r+15||
  y>HEIGHT-r-15
 )return false;

 if(type==="trough"){
  return S.buildings.some(b=>
   PENS[b.type]&&
   Math.abs(x-b.x)<BUILD[b.type][3]*.6&&
   Math.abs(y-b.y)<BUILD[b.type][3]*.4
  )&&!S.buildings.some(b=>
   b.type==="trough"&&
   distance({x,y},b)<40
  );
 }

 for(const dx of [-r,0,r]){
  for(const dy of [-r,0,r]){
   if(!dry(x+dx,y+dy))return false;
  }
 }

 for(const b of S.buildings){
  if(
   ["fence","gate"].includes(type)&&
   ["fence","gate"].includes(b.type)
  ){
   if(distance({x,y},b)<20)return false;
   continue;
  }

  if(
   distance({x,y},b)<
   r+BUILD[b.type][3]+10
  )return false;
 }

 if(S.fires.some(f=>distance(f,{x,y})<r+22)){
  return false;
 }

 return !nearNodes(x,y,r+25).some(n=>
  !gathered(n)&&
  ["tree","hardwood","rock"].includes(n.type)&&
  distance(n,{x,y})<r+23
 );
}

 x=Math.round(x/snap)*snap;

 if(!validSpot(type,x,y)){
  return notice(
   "Choose a clear location within building range."
  );
 }

 if(!take(BUILD[type][2])){
  return notice(
   "Need "+costText(BUILD[type][2])
  );

 const pen=type==="trough"?
  S.buildings.find(b=>
   PENS[b.type]&&
   Math.abs(x-b.x)<BUILD[b.type][3]*.6&&
   Math.abs(y-b.y)<BUILD[b.type][3]*.4
  ):null;

 S.buildings.push({
  id:"b"+Date.now()+S.buildings.length,
  type,x,y,
  level:1,
  storage:{},
  charges:0,
  waterProgress:0,
  progress:0,
  growth:0,
  planted:false,
  ripe:false,
  feed:0,
  bait:0,
  products:{},
  gateOpen:false,
  open:false,

  smokeRemaining:0,
  smokeReady:0,

 });

 if(
  !["fence","gate"].includes(type)||
  !has(BUILD[type][2])
 ){
  mode="";
 }

 notice(
  BUILD[type][1]+
  " built!"+
  (mode==="build"?
   " Keep clicking to extend or press Esc.":"")
 );

 checkMissions();
 renderUI();
 save();
}

function fillBucket(){
 if(!S.tools.farmBucket){
  return notice(
   "Craft a wooden farm bucket first."
  );
 }

 if(S.farmWater>=6){
  return notice(
   "Bucket already full."
  );
 }

 const w=nearWell();
 const collector=nearBuilding("collector");

 if(nearWater()){
  S.farmWater=6;
 }else if(w){
  w.charges--;
  S.farmWater=6;
 }else if(collector&&collector.charges>0){
  collector.charges--;
  S.farmWater=Math.min(6,S.farmWater+3);
 }else if(S.jugWater){
  S.jugWater--;
  S.farmWater=Math.min(6,S.farmWater+3);
 }else{
  return notice(
   "Find lake water, a filled collector, well, or jug."
  );
 }

 notice("Farm bucket filled.");
 renderUI();
 save();
}

}

function farmMenu(b){
 const crop=b.crop&&CROP[b.crop];

 const status=!crop?
  "Unplanted plot. Choose your crop.":
  b.ripe?
   "Ready for harvest.":
   `${b.crop}: ${Math.floor(b.growth||0)}/${crop[2]} game minutes. ${b.watered?"Watered":"Needs watering"}.`;

 const acts=!crop?
  Object.keys(CROP).map(k=>[
   "plant:"+k,
   "Plant "+CROP[k][0]+" "+k
  ]):
  b.ripe?
   [["harvest","🌾 Harvest crops"]]:
   [["water","🪣 Water plot"]];

 acts.push(["fill","🪣 Fill bucket"]);

 showMenu(
  "🌱 Farm Plot · Level "+b.level,
  status+` Bucket water: ${S.farmWater}/6.`,
  `<div class="grid">`+
   acts.map(([id,label])=>
    `<button data-act="${id}">${label}</button>`
   ).join("")+
  `</div>`,
  act=>{

   if(act==="fill"){
    return fillBucket();
   }

   if(act.startsWith("plant:")){
    const k=act.slice(6);
    const seed=CROP[k]?.[1];

    if(b.crop||!S.inventory[seed]){
     return notice(
      "You need "+(ITEMS[seed]?.[1]||"seeds")+"."
     );
    }

    S.inventory[seed]--;
    b.crop=k;
    b.growth=0;
    b.ripe=false;
    b.watered=false;

    S.homestead.planted++;

    notice(
     "Planted "+k+". Water once to start growth."
    );
   }

   if(act==="water"){
    if(!S.farmWater){
     notice("Fill your bucket first.");
     return;
    }

    S.farmWater--;
    b.watered=true;
    S.homestead.waterings++;

    notice("Plot watered.");
   }

   if(act==="harvest"&&b.ripe){
    let n=CROP[b.crop][3]+
     (b.level>1?
      Math.ceil(CROP[b.crop][3]*.5):0);

    gain(b.crop,n);
    gain(CROP[b.crop][1],2);

    S.homestead.harvested+=n;

    S.homestead.types[b.crop]=
     (S.homestead.types[b.crop]||0)+n;

    notice(
     "Harvested "+n+" "+b.crop+
     " and two seeds!"
    );

    b.crop=null;
    b.watered=false;
    b.ripe=false;
    b.growth=0;
   }

   checkMissions();
   renderUI();
   save();

   closeMenu();
   S.paused=false;
   farmMenu(b);
  }
 );
}

function storageMenu(b){
 const kinds=STORAGE[b.type];

 const max=STORAGE_CAP[b.type][
  b.level>1?1:0
 ];

 const stored=()=>Object.values(b.storage)
  .reduce((a,n)=>a+(+n||0),0);

 function refresh(){
  const list=kinds.filter(k=>
   (S.inventory[k]||0)||
   (b.storage[k]||0)
  );

  $("menuText").textContent=
   `${BUILD[b.type][1]} · ${stored()}/${max} stored. Stored items return to the backpack if deleted.`;

  $("menuContent").innerHTML=`
   <table id="storageItems">
    <tr>
     <th>Item</th>
     <th>Pack</th>
     <th>Stored</th>
     <th>Deposit</th>
     <th>Withdraw</th>
    </tr>
   `+
   list.map(k=>`
    <tr>
     <td>${ITEMS[k][0]} ${ITEMS[k][1]}</td>
     <td>${S.inventory[k]||0}</td>
     <td>${b.storage[k]||0}</td>
     <td>
      <button data-act="in:${k}:1">+1</button>
      <button data-act="in:${k}:5">+5</button>
     </td>
     <td>
      <button data-act="out:${k}:1">−1</button>
      <button data-act="out:${k}:5">−5</button>
     </td>
    </tr>
   `).join("")+
   "</table>";
 }

 showMenu(
  BUILD[b.type][0]+" "+BUILD[b.type][1],
  "",
  "",
  act=>{

   let [way,k,n]=act.split(":");
   let v=Number(n);

   let q=way==="in"?
    Math.min(v,S.inventory[k]||0,max-stored()):
    Math.min(v,b.storage[k]||0);

   if(q<=0){
    return notice(
     "Not enough items or space."
    );
   }

   if(way==="in"){
    S.inventory[k]-=q;

    b.storage[k]=(b.storage[k]||0)+q;
    S.milestones.stored+=q;

   }else{
    b.storage[k]-=q;
    gain(k,q);
   }

   refresh();
   checkMissions();
   renderUI();
   save();
  }
 );

 refresh();
}

function penMenu(b){

 ].find(k=>S.inventory[k]>0)||cfg[2];

 );

   if(act==="gate"){
    b.gateOpen=!b.gateOpen;

    if(!b.gateOpen){
     for(const a of animals){
      if(a.mode!=="pen"){
       a.mode="pen";

       S.captured[a.type]=
        (S.captured[a.type]||0)+1;
      }
     }
    }

    notice(
     b.gateOpen?

    );
   }

   if(act==="feed"){
    if(!S.inventory[food]){
     return notice("Need feed.");
    }

    S.inventory[food]--;
    b.feed=Math.min(500,b.feed+150);

    notice("Animals fed.");
   }

   if(act==="bait"){
    if(!trough){
     return notice(
      "Build a feeding trough inside this pen."
     );
    }

    if(!S.inventory[food]){
     return notice("Need feed.");
    }

    S.inventory[food]--;
    trough.bait=(trough.bait||0)+2;

    notice(
     "Trough baited. Open the gate to attract animals."
    );
   }

   if(act==="collect"){
    let total=0;

    for(const [k,n] of Object.entries(b.products)){
     if(n){
      gain(k,n);

      S.livestockProducts[k]=
       (S.livestockProducts[k]||0)+n;

      total+=n;
      b.products[k]=0;
     }
    }

    notice(
     total?
     "Collected "+total+" animal products.":
     "No products ready."
    );
   }

   checkMissions();
   renderUI();
   save();

   closeMenu();
   S.paused=false;
   penMenu(b);
  }
 );
}

       "Unplanted.":
     "Materials come from your backpack.";

 showMenu(
  BUILD[b.type][0]+" "+BUILD[b.type][1],
  detail,
  `<div class="grid">`+
   actions.map(([a,label])=>
    `<button data-act="${a}">${label}</button>`
   ).join("")+
  `</div>`,
  act=>{

   if(act==="drink"){
    return drink();
   }

   if(act==="fill"){
    return fillBucket();
   }

   if(act==="jugs"){
    return fillJugs();
   }

   if(act==="smoke"){
    if(b.smokeRemaining){
     return notice(
      "Meat is already smoking."
     );
    }

    let n=b.level>1?5:3;

    if(!take({rawMeat:n,logs:1})){
     return notice(
      "Need "+n+" raw meat and one log."
     );
    }

    b.smokeAmount=n;
    b.smokeRemaining=b.level>1?140:180;

    notice("Smokehouse started.");
   }

   if(act==="collect"){
    if(!b.smokeReady){
     return notice(
      "Nothing ready yet."
     );
    }

    gain("smokedMeat",b.smokeReady);

    notice(
     "Collected "+b.smokeReady+
     " smoked meat."
    );

    b.smokeReady=0;
   }

   if(
    act==="bricks"||
    act==="iron"||
    act==="jug"
   ){
    let cost=act==="bricks"?
     {clay:4,coal:1}:
     act==="iron"?
      {iron:3,coal:2}:
      {clay:5,coal:1};

    if(!take(cost)){
     return notice(
      "Need "+costText(cost)
     );
    }

    gain(
     act==="bricks"?
      "bricks":
      act==="iron"?
       "ironBars":"jugs",
     act==="bricks"?
      b.level>1?4:3:1
    );

    notice(
     "Furnace completed "+act
    );
   }

   if(act==="fuel"){
    if(!take({coal:1})){
     return notice("Need coal.");
    }

    b.fuel=
     (b.fuel||0)+
     (b.level>1?480:300);

    notice("Hearth fueled.");
   }

   if(act==="plant"){
    if(b.planted){
     return notice("Already planted.");
    }

    if(!take({berries:2})){
     return notice("Need two berries.");
    }

    b.planted=true;
    b.progress=0;
    b.ripe=false;

    notice("Berry garden planted.");
   }

   if(act==="harvest"){
    if(!b.ripe){
     return notice(
      "Berries aren't ripe."
     );
    }

    gain(
     "berries",
     b.level>1?11:6
    );

    b.planted=false;
    b.ripe=false;
    b.progress=0;

    S.milestones.harvestedGarden++;

    notice("Berry garden harvested.");
   }

   checkMissions();
   save();
   renderUI();

   closeMenu();
   S.paused=false;
   productionMenu(b);
  }
 );
}

function interactBuilding(b){
 if(distance(b,S.player)>135){
  return notice(
   "Move closer to the structure."
  );
 }

 if(b.type==="workbench"){
  return craftMenu();
 }

 if(b.type==="gate"){
  b.open=!b.open;

  notice(
   b.open?
   "Gate opened.":
   "Gate closed."
  );

  return save();
 }

 if(b.type==="fence"){
  return notice(
   "Fence section. Build more sections alongside it."
  );
 }

 if(STORAGE[b.type]){
  return storageMenu(b);
 }

 if(b.type==="farmPlot"){
  return farmMenu(b);
 }

 if(PENS[b.type]){
  return penMenu(b);
 }

 if(b.type==="trough"){
  const p=S.buildings.find(v=>
   v.id===b.penId
  );

  if(p)return penMenu(p);

  return notice(
   "No connected pen."
  );
 }

 if(
  ["cabin","tent"].includes(b.type)
 ){
  return showMenu(
   BUILD[b.type][1],
   "Shelter restores warmth and energy.",
   `<button data-act="sleep">
    💤 Sleep
   </button>`,
   act=>{
    if(act==="sleep"){
     closeMenu();
     S.paused=false;
     sleep();
    }
   }
  );
 }

 return productionMenu(b);
}

function interactAnimal(a){
 if(
  PENS[
   S.buildings.find(b=>b.id===a.penId)?.type
  ]||a.penId
 ){
  return notice(
   "Livestock belongs to an enclosure."
  );
 }

 if(
  S.combat.equipped!=="hands"&&
  loot[a.type]
 ){
  return attack(a);
 }

 if(
  !["chicken","sheep","cow"]
   .includes(a.type)
 ){
  return notice(
   "Wild "+a.type+
   ". Equip a weapon to hunt."
  );
 }

 let food=a.type==="chicken"?
  "seeds":
  S.inventory.grass?
   "grass":"hay";

 if(!S.inventory[food]){
  return notice(
   "Carry "+ITEMS[food][1]+
   " to lure "+a.type+"."
  );
 }

 a.mode="follow";

 notice(
  a.type+
  " is following your food. Lead it to an open enclosure."
 );
}

function deleteAt(o){
 if(!o){
  return notice(
   "Select a removable object. Terrain and water are permanent."
  );
 }

 const {kind,obj}=o;

 const label=kind==="building"?
  BUILD[obj.type][1]:
  kind==="node"?
   obj.type:
   kind==="animal"?
    obj.type:
    kind==="fire"?
     "Campfire":"Animal Remains";

 let count=kind==="building"?
  Object.values(obj.storage||{})
   .reduce((a,n)=>a+(+n||0),0):
  0;

 if(!confirm(
  `Delete ${label}? No building materials are refunded.`+
  (count?
   ` ${count} stored items return to your pack.`:
   "")+
  " This cannot be undone."
 )){
  return;
 }

 if(kind==="building"){
  for(const [k,n] of Object.entries(obj.storage||{})){
   gain(k,n);
  }

  if(obj.type==="smokehouse"){
   gain(
    "smokedMeat",
    obj.smokeReady||0
   );

   if(obj.smokeRemaining){
    gain(
     "rawMeat",
     obj.smokeAmount||0
    );
   }
  }

  if(PENS[obj.type]){
   for(const a of penAnimals(obj)){
    a.mode="wild";
    a.penId=null;
    a.homeX=a.x;
    a.homeY=a.y;
   }

   S.buildings=S.buildings.filter(b=>
    b.penId!==obj.id
   );
  }

  S.buildings=S.buildings.filter(b=>
   b!==obj
  );

 }else if(kind==="node"){
  S.gathered[obj.id]=true;

 }else if(kind==="animal"){
  S.animals=S.animals.filter(a=>a!==obj);

 }else if(kind==="corpse"){
  S.carcasses=S.carcasses.filter(c=>c!==obj);

 }else if(kind==="fire"){
  S.fires=S.fires.filter(f=>f!==obj);
 }

 notice(label+" deleted.");
 renderUI();
 save();
}

function fireBuild(){
 if(!benchNearby()){
  return notice(
   "Build a campfire while near the workbench."
  );
 }

 if(!take({sticks:5,pebbles:3})){
  return notice(
   "Campfire requires five sticks and three pebbles."
  );
 }

 let x=S.player.x+50;
 let y=S.player.y;

 if(!dry(x,y)){
  return notice(
   "Find a clear place."
  );
 }

 S.fires.push({
  x,y,fuel:360
 });

 notice(
  "Campfire built and lit."
 );

 save();
}

function specialCraftMenu(){
 showMenu(
  "🔥 Cooking & Campfire",
  "Campfire costs five sticks and three pebbles. Cook or rest beside it.",
  `<div class="grid">
   <button data-act="fire">
    🔥 Build Campfire
   </button>
   <button data-act="food">
    🍲 Open Food Menu
   </button>
   <button data-act="refuel">
    🪵 Refuel Campfire
   </button>
   </div>`,
  act=>{

   if(act==="fire"){
    fireBuild();
   }

   if(act==="food"){
    closeMenu();
    S.paused=false;
    foodMenu();
   }

   if(act==="refuel"){
    let f=S.fires.find(f=>
     distance(f,S.player)<125
    );

    if(!f||!take({sticks:3})){
     return notice(
      "Need three sticks near a campfire."
     );
    }

    f.fuel+=180;

    notice(
     "Campfire refueled."
    );
   }

   renderUI();
   save();
  }
 );
}

function reset(){
 if(
  !S.dead&&
  !confirm(
   "Erase your saved game and start a new one?"
  )
 ){
  return;
 }

 try{
  localStorage.removeItem(SAVE);
 }catch(e){}

 S=fresh();
 mode="";
 closeMenu();

 if($("invDialog").open){
  $("invDialog").close();
 }

 if($("mapDialog").open){
  $("mapDialog").close();
 }

 reveal(
  S.player.x,
  S.player.y
 );

 renderUI();

 notice(
  "New wilderness journey begins."
 );

 save();
}

function inventoryMenu(){
 if(modalOpen())return;

 pausedBefore=S.paused;
 S.paused=true;

 $("inventoryItems").innerHTML=
  Object.entries(ITEMS).map(([k,v])=>`
   <div>
    ${v[0]}<br>
    ${v[1]}<br>
    <strong>${S.inventory[k]||0}</strong>
   </div>
  `).join("");

 $("invDialog").showModal();
}

function openMap(){
 if($("mapDialog").open){
  return $("mapDialog").close();
 }

 if(modalOpen())return;

 pausedBefore=S.paused;
 S.paused=true;

 $("mapDialog").showModal();

 drawMap();
}

function drawMap(){
 const w=MW.width;
 const h=MW.height;

 const discovered=new Set(
  S.exploredTiles
 );

 mc.fillStyle="#081812";
 mc.fillRect(0,0,w,h);

 for(const tile of discovered){
  let ix=tile%80;
  let iy=Math.floor(tile/80);

  let x=(ix+.5)*80;
  let y=(iy+.5)*80;

  mc.fillStyle=water(x,y)?
   "#2e8399":
   BIOMES[biome(x,y)][1];

  mc.fillRect(
   ix*10,
   iy*10,
   10,10
  );
 }

 for(const b of S.buildings){
  if(!explored(b.x,b.y))continue;

  mc.fillStyle="#e5ae61";

  mc.fillRect(
   b.x/8-3,
   b.y/8-3,
   6,6
  );
 }

 for(const m of S.mapMarkers){
  if(!explored(m.x,m.y))continue;

  mc.fillStyle=({
   home:"#ffe19a",
   ore:"#d2dbe4",
   water:"#69d6ef",
   danger:"#e97660",
   other:"#f1beff"
  })[m.type]||"#fff";

  mc.beginPath();

  mc.arc(
   m.x/8,
   m.y/8,
   6,0,7
  );

  mc.fill();

  mc.fillStyle="#fff";
  mc.font="12px Arial";

  mc.fillText(
   m.name,
   m.x/8+8,
   m.y/8-8
  );
 }

 mc.fillStyle="#3c95ff";
 mc.beginPath();

 mc.arc(
  S.player.x/8,
  S.player.y/8,
  5,0,7
 );

 mc.fill();

 $("mapInfo").textContent=
  `${discovered.size}/4800 tiles explored · ${S.mapMarkers.length} markers`;
}

function setup(){
 let handlers={

  benchBtn:()=>{
   if(S.buildings.some(b=>b.type==="workbench")){
    return craftMenu();
   }

   buildType="workbench";
   mode="build";

   notice(
    "Collect five sticks and three pebbles. Click nearby to place the workbench."
   );
  },

  craftBtn:()=>craftMenu(),

  inventoryBtn:inventoryMenu,

  mapBtn:openMap,

  gatherBtn:nearbyGather,

  eatBtn:foodMenu,

  drinkBtn:drink,

  restBtn:sleep,

  roastBtn:specialCraftMenu,

  removeBtn:()=>{
   mode=mode==="delete"?"":"delete";

   notice(
    mode?
    "REMOVE MODE: click an object, confirm deletion. Esc exits.":
    "Remove mode disabled."
   );

   renderUI();
  },

  cancelBtn:()=>{
   mode="";
   renderUI();
  },

  pauseBtn:()=>{
   S.paused=!S.paused;
   renderUI();
  },

  fullBtn:()=>{
   if(document.fullscreenElement){
    document.exitFullscreen();
   }else{
    $("app").requestFullscreen().catch(()=>
     notice("Fullscreen unavailable.")
    );
   }
  },

  saveBtn:()=>save(true),

  helpBtn:()=>showMenu(
   "Welcome to Wilderness",
   "Gather sticks and pebbles, build your workbench, explore, hunt, plant crops, raise animals, and develop a settlement.",
   `<p>
    WASD/arrows: move · E: gather ·
    I: inventory · M: map ·
    1: hands · 2: spear · 3: bow ·
    Shift: sneak · Delete: toggle removal ·
    Esc: cancel.
   </p>
   <p>
    Workstations and structures are physical.
    Click them to use them.
    Buildings unlock through survival milestones.
    Grow crops by planting and watering each plot once;
    crops mature during travel or sleep.
    Open livestock gates and lure matching animals
    inside with food.
   </p>`,
   ()=>{}
  ),

  newBtn:reset,

  touchGather:nearbyGather,

  touchAttack:()=>attack(),

  touchBuild:()=>craftMenu(),

  touchRemove:()=>$("removeBtn").click()

 };

 for(const [id,fn] of Object.entries(handlers)){
  $(id).onclick=fn;
 }

 $("menuClose").onclick=closeMenu;

 $("inventoryClose").onclick=()=>
  $("invDialog").close();

 $("mapClose").onclick=()=>
  $("mapDialog").close();

 for(const id of [
  "menu","invDialog","mapDialog"
 ]){
  $(id).addEventListener("close",()=>{
   S.paused=pausedBefore;
   keys.clear();
   renderUI();
  });
 }

 $("progress").onclick=showProgress;

 $("progress").onkeydown=e=>{
  if(e.key==="Enter"){
   showProgress();
  }
 };

 document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")){
   return;
  }

  const k=e.key.toLowerCase();

  if([
   "arrowup",
   "arrowdown",
   "arrowleft",
   "arrowright",
   " "
  ].includes(k)){
   e.preventDefault();
  }

  if([
   "w","a","s","d",
   "arrowup",
   "arrowdown",
   "arrowleft",
   "arrowright",
   "shift"
  ].includes(k)){
   keys.add(k);
  }

  if(e.repeat)return;

  if(k==="escape"){
   if(mode){
    mode="";
    renderUI();

   }else if($("menu").open){
    closeMenu();
   }

   return;
  }

  if(modalOpen()){
   if(k==="i"&&$("invDialog").open){
    $("invDialog").close();
   }

   if(k==="m"&&$("mapDialog").open){
    $("mapDialog").close();
   }

   return;
  }

  if(k==="e")nearbyGather();
  if(k==="i")inventoryMenu();
  if(k==="m")openMap();
  if(k==="f")drink();
  if(k==="q")foodMenu();
  if(k==="r")sleep();

  if(k==="1"){
   S.combat.equipped="hands";
  }

  if(k==="2"){
   if(S.tools.spear){
    S.combat.equipped="spear";
   }else{
    notice("Craft a spear first.");
   }
  }

  if(k==="3"){
   if(S.tools.bow){
    S.combat.equipped="bow";
   }else{
    notice("Craft a bow first.");
   }
  }

  if(k==="delete"){
   $("removeBtn").click();
  }

  if(k===" "){
   $("pauseBtn").click();
  }

  renderUI();
 });

 document.addEventListener("keyup",e=>
  keys.delete(e.key.toLowerCase())
 );

 window.addEventListener("blur",()=>{
  keys.clear();
  pressed.clear();
 });

 for(const b of document.querySelectorAll("[data-dir]")){
  b.onpointerdown=e=>{
   e.preventDefault();
   b.setPointerCapture(e.pointerId);
   pressed.add(b.dataset.dir);
  };

  for(const ev of [
   "pointerup",
   "pointercancel",
   "lostpointercapture"
  ]){
   b.addEventListener(ev,()=>
    pressed.delete(b.dataset.dir)
   );
  }
 }

 cv.onpointermove=e=>{
  mouse={
   ...point(e),
   inside:true
  };
 };

 cv.onpointerleave=()=>{
  mouse.inside=false;
 };

 cv.onclick=e=>{
  if(
   S.dead||
   modalOpen()||
   S.paused
  )return;

  const p=point(e);

  if(mode==="build"){
   return placeAt(p.x,p.y);
  }

  const o=objectAt(p.x,p.y);

  if(mode==="delete"){
   return deleteAt(o);
  }

  if(mode==="upgrade"){
   if(o?.kind==="building"){
    return upgradeAt(o.obj);
   }

   return notice(
    "Click the structure to upgrade."
   );
  }

  if(!o){
   if(water(p.x,p.y)){
    drink();
   }

   return;
  }

  if(o.kind==="node"){
   return gather(o.obj);
  }

  if(o.kind==="corpse"){
   return harvestCarcass(o.obj);
  }

  if(o.kind==="animal"){
   return interactAnimal(o.obj);
  }

  if(o.kind==="building"){
   return interactBuilding(o.obj);
  }

  if(o.kind==="fire"){
   specialCraftMenu();
  }
 };

 cv.oncontextmenu=e=>{
  e.preventDefault();
 };

 MW.onclick=e=>{
  const r=MW.getBoundingClientRect();

  const x=
   (e.clientX-r.left)/r.width*WIDTH;

  const y=
   (e.clientY-r.top)/r.height*HEIGHT;

  if(!explored(x,y)){
   return notice(
    "Travel to explore that area first."
   );
  }

  mapPosition={
   x:Math.round(x),
   y:Math.round(y)
  };

  selectedMarker=S.mapMarkers.find(m=>
   Math.hypot(m.x-x,m.y-y)<90
  )||null;

  $("markerName").value=
   selectedMarker?.name||"";

  $("markerKind").value=
   selectedMarker?.type||"other";

  $("mapInfo").textContent=
   `X ${Math.round(x)} · Y ${Math.round(y)} · ${BIOMES[biome(x,y)][0]}`;
 };

 $("markerSave").onclick=()=>{
  let name=$("markerName").value
   .trim()
   .slice(0,28);

  if(!name||!mapPosition){
   return notice(
    "Click explored terrain and enter a name."
   );
  }

  if(selectedMarker){
   selectedMarker.name=name;
   selectedMarker.type=
    $("markerKind").value;

  }else if(S.mapMarkers.length<35){
   S.mapMarkers.push({
    ...mapPosition,
    id:"m"+Date.now(),
    name,
    type:$("markerKind").value
   });
  }

  drawMap();
  save();
 };

 $("markerDelete").onclick=()=>{
  if(selectedMarker){
   S.mapMarkers=S.mapMarkers.filter(m=>
    m!==selectedMarker
   );
  }

  selectedMarker=null;
  mapPosition=null;

  drawMap();
  save();
 };

 window.addEventListener(
  "beforeunload",
  ()=>save()
 );
}

function start(){
 makeNodes();

 const loaded=load();

 reveal(
  S.player.x,
  S.player.y
 );

 setup();
 renderUI();

 if(!loaded){
  S.paused=false;

  showMenu(
   "🏕 Welcome to the Last Frontier",
   "Build your first workbench with five sticks and three pebbles.",
   `<p>
    Explore the world, hunt wildlife,
    raise livestock, grow crops and
    build a homestead.
   </p>
   <p>
    All five Version 2.7 expansion buildings
    are included: Woodshed, Smokehouse,
    Root Cellar, Water Well and Large Barn.
   </p>
   <p>
    Delete mode removes placed structures,
    wildlife, campfires, natural resources
    and remains. It requests confirmation
    before removing anything.
   </p>`,
   ()=>{}
  );

 }else{
  notice(
   "Welcome back to your homestead!"
  );
 }

 function frame(t){
  const dt=Math.min(
   .06,
   (t-frameLast)/1000||0
  );

  frameLast=t;

  if(toastTimer>0){
   toastTimer-=dt;

   if(toastTimer<=0){
    $("toast").style.opacity=0;
   }
  }

  advance(dt);
  paint();

  requestAnimationFrame(frame);
 }

 requestAnimationFrame(frame);
}

// CORRECTED CAMPFIRE GRAPHICS

drawFire=function(f,x,y){
 ctx.fillStyle="#948875";

 for(let i=0;i<8;i++){
  let a=i*Math.PI/4;

  ctx.beginPath();

  ctx.arc(
   x+Math.cos(a)*13,
   y+Math.sin(a)*10,
   5,0,7
  );

  ctx.fill();
 }

 if(f.fuel>0){
  ctx.font="29px Arial";
  ctx.fillText("🔥",x-14,y+2);
 }
};

// LAUNCH THE COMPLETE GAME

start();

</script>
