
<style id="v16-layout-styles">
/* Wilderness V1.6 — Full Width Game */

#layout {
  display: block;
  width: 100%;
  max-width: 1800px;
  padding: 8px;
}

#layout main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

#viewport {
  display: flex;
  align-items: center;
  justify-content: center;
  height: clamp(300px, calc(100dvh - 238px), 1000px);
  min-height: 0;
  background: #243d2c;
}

#game {
  width: min(100%, calc((100dvh - 245px) * 1.6));
  height: auto;
  max-height: 100%;
  aspect-ratio: 16 / 10;
}

/* Compact Survivor HUD */

#survivalHud {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

#survivalHud .hudStats {
  display: block;
}

#survivalHud #statusPanel {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}

#survivalHud .stat {
  background: #152b24;
  border: 1px solid #355a45;
  border-radius: 6px;
  padding: 5px 8px;
  margin: 0;
}

#survivalHud .statline {
  font-size: 11px;
  margin-bottom: 3px;
}

#survivalHud .bar {
  height: 7px;
}

#survivalHud .hudBottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

#survivalHud .inventory {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

#survivalHud .item {
  display: flex;
  flex-direction: row;
  gap: 5px;
  padding: 3px 7px;
  min-height: 32px;
  white-space: nowrap;
  font-size: 11px;
}

#survivalHud .emoji {
  font-size: 16px;
}

#survivalHud .equipment {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

#survivalHud .equip {
  min-width: 0;
  padding: 5px 8px;
  font-size: 11px;
  white-space: nowrap;
}

/* Game Buttons */

.toolbar {
  margin: 1px 0;
  gap: 5px;
}

.toolbar button {
  padding: 7px 10px;
}

.toolbar .btn {
  width: auto;
  margin: 0;
  font-weight: normal;
}

.toolbar .btn small {
  display: none;
}

#quest {
  margin: 0;
  padding: 7px 10px;
}

#journal {
  line-height: 1.3;
}

#fullscreenBtn {
  background: #244a50;
  border-color: #79b6b8;
}

/* Actual Browser Fullscreen */

#gameArea:fullscreen {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
  width: 100vw;
  height: 100dvh;
  max-width: none;
  margin: 0;
  padding: 6px;
  background: #0c1815;
}

#gameArea:fullscreen #viewport {
  height: auto;
  min-height: 0;
  flex: 1;
}

#gameArea:fullscreen #game {
  width: auto;
  height: min(100%, calc((100vw - 20px) * .625));
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 10;
}

#gameArea:fullscreen #survivalHud,
#gameArea:fullscreen .toolbar {
  flex-shrink: 0;
}

#gameArea:fullscreen #quest {
  margin: 0;
  padding: 4px 8px;
  font-size: 11px;
}

#gameArea:fullscreen #journal {
  font-size: 11px;
}

/* Mobile Adjustments */

@media(max-width: 750px) {
  #survivalHud #statusPanel {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #survivalHud .hudBottom {
    flex-direction: column;
    align-items: stretch;
  }

  #viewport {
    height: clamp(270px, calc(100dvh - 260px), 670px);
  }

  #game {
    width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  #gameArea:fullscreen #viewport {
    flex: 1;
  }
}
</style>

<script id="v16-fullscreen-and-sidebar">

// Wilderness: Last Frontier V1.6
// Preserves the original game engine.

(function installFullscreenLayout() {

  const area = document.querySelector("#layout main");
  const sidebar = document.querySelector("#layout aside");
  const toolbar = area?.querySelector(".toolbar");

  if (!area || !sidebar || !toolbar) return;

  // Main game area becomes fullscreen container.
  area.id = "gameArea";

  // Create compact survivor HUD.
  const hud = document.createElement("div");
  hud.id = "survivalHud";

  const stats = document.createElement("div");
  stats.className = "hudStats";

  // Move existing status display.
  stats.append(
    document.getElementById("statusPanel")
  );

  const bottom = document.createElement("div");
  bottom.className = "hudBottom";

  // Move original inventory.
  bottom.append(
    document.getElementById("inventoryPanel")
  );

  // Move existing equipment display.
  const equipment = sidebar.querySelector(".equipment");

  if (equipment) {
    bottom.append(equipment);
  }

  hud.append(stats, bottom);

  // Place HUD below game and above toolbar.
  toolbar.before(hud);

  // Create fullscreen button.
  const fullscreen = document.createElement("button");

  fullscreen.id = "fullscreenBtn";
  fullscreen.type = "button";
  fullscreen.textContent = "⛶ Fullscreen";

  toolbar.insertBefore(
    fullscreen,
    toolbar.children[1] || null
  );

  // Move working survival buttons into toolbar.
  // Their original event listeners remain attached.
  const originalButtons = [
    "eatBtn",
    "eatRation",
    "drinkBtn",
    "restBtn",
    "cancelBuild"
  ];

  for (const id of originalButtons) {
    const btn = document.getElementById(id);

    if (!btn) continue;

    if (id === "cancelBuild") {
      toolbar.append(btn);
    } else {
      toolbar.insertBefore(
        btn,
        document.getElementById("interactBtn")
      );
    }
  }

  // Remove the right menu entirely.
  sidebar.remove();

  // Fullscreen toggle.
  async function fullscreenToggle() {

    try {

      if (document.fullscreenElement) {
        await document.exitFullscreen();

      } else if (area.requestFullscreen) {
        await area.requestFullscreen();

      } else {
        message(
          "Fullscreen is unavailable in this browser."
        );
      }

    } catch (err) {

      message(
        "Browser prevented fullscreen. Try the fullscreen button again."
      );

    }
  }

  fullscreen.addEventListener(
    "click",
    fullscreenToggle
  );

  // Change the button label when fullscreen changes.
  document.addEventListener(
    "fullscreenchange",
    () => {

      fullscreen.textContent =
        document.fullscreenElement
          ? "⛶ Exit Fullscreen"
          : "⛶ Fullscreen";

    }
  );

  // B opens Buildings in the K crafting menu.
  // This replaces the old B shortcut that
  // selected only the tent.

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.code !== "KeyB" ||
        event.repeat ||
        event.target.matches("input,textarea")
      ) return;

      const modalOpen = [
        "craftDialog",
        "helpDialog",
        "structureDialog",
        "storageDialog"
      ].some(id => document.getElementById(id)?.open);

      if (modalOpen) return;

      event.preventDefault();
      event.stopImmediatePropagation();

      craftCategory = "buildings";
      openCraft();

    },
    true
  );

  // Rebuild displays in their new locations.
  updateUI();

})();
</script>
